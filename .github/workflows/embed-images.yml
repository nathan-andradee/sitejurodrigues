name: Embed site images as WebP

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  embed-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Convert images and embed them in index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          import io
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          images = {
              'ju-treino.jpg': 'images/ju-treino.jpg',
              'ju-academia.jpg': 'images/ju-academia.jpg',
              'ju-pilates.webp': 'images/ju-pilates.webp',
          }

          total_replacements = 0
          for filename, source in images.items():
              path = Path(source)
              if not path.exists():
                  print(f'{source} não existe; provavelmente já foi incorporada. Pulando.')
                  continue

              with Image.open(path) as im:
                  im = im.convert('RGB')
                  max_dimension = 1400
                  if max(im.size) > max_dimension:
                      scale = max_dimension / max(im.size)
                      im = im.resize((round(im.width * scale), round(im.height * scale)), Image.Resampling.LANCZOS)
                  buffer = io.BytesIO()
                  im.save(buffer, format='WEBP', quality=72, method=6)
                  encoded = base64.b64encode(buffer.getvalue()).decode('ascii')

              data_uri = 'data:image/webp;base64,' + encoded

              # Corrige inclusive URLs malformadas/duplicadas que já estejam no HTML.
              patterns = [
                  rf'https?://[^"\'\s)]+{re.escape(filename)}',
                  re.escape(source),
                  re.escape(filename),
              ]
              before = html
              for pattern in patterns:
                  html = re.sub(pattern, lambda m: data_uri, html)
              if html != before:
                  total_replacements += 1
                  print(f'{filename}: incorporada como WebP inline.')
              else:
                  print(f'Aviso: nenhuma referência encontrada para {filename}.')

          if total_replacements == 0 and Path('images').exists():
              raise SystemExit('Nenhuma das imagens foi encontrada no index.html; abortando para não alterar o site incorretamente.')

          index.write_text(html, encoding='utf-8')
          PY

      - name: Remove external image folder
        run: rm -rf images

      - name: Commit embedded images to pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Embed optimized WebP images directly in HTML"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
