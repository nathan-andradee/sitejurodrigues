name: Embed site images as WebP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Convert images and embed them in index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          import io
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          images = {
              'ju-treino.jpg': 'images/ju-treino.jpg',
              'ju-academia.jpg': 'images/ju-academia.jpg',
              'ju-pilates.webp': 'images/ju-pilates.webp',
          }

          total_replacements = 0
          for filename, source in images.items():
              path = Path(source)
              if not path.exists():
                  raise SystemExit(f'Imagem não encontrada: {source}')

              with Image.open(path) as im:
                  im = im.convert('RGB')
                  max_dimension = 1400
                  if max(im.size) > max_dimension:
                      scale = max_dimension / max(im.size)
                      im = im.resize((round(im.width * scale), round(im.height * scale)), Image.Resampling.LANCZOS)
                  buffer = io.BytesIO()
                  im.save(buffer, format='WEBP', quality=72, method=6)
                  encoded = base64.b64encode(buffer.getvalue()).decode('ascii')

              data_uri = 'data:image/webp;base64,' + encoded
              alternatives = [
                  source,
                  filename,
                  f'https://raw.githubusercontent.com/nathan-andradee/sitejurodrigues/main/{source}',
                  f'https://github.com/nathan-andradee/sitejurodrigues/raw/refs/heads/main/{source}',
              ]

              before = html
              for old in alternatives:
                  html = html.replace(old, data_uri)
              if html == before:
                  print(f'Aviso: nenhuma referência encontrada para {filename}')
              else:
                  total_replacements += 1

          if total_replacements == 0:
              raise SystemExit('Nenhuma das 3 imagens foi encontrada no index.html; abortando para não alterar o site incorretamente.')

          index.write_text(html, encoding='utf-8')
          PY

      - name: Remove external image folder
        run: rm -rf images

      - name: Commit embedded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Embed optimized WebP images directly in HTML"
            git push
          fi
