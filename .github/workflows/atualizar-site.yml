name: Atualizar fotos e pagamento
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  atualizar-site:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar imagens e checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'const CHECKOUT_URL\s*=\s*"[^"]*";', 'const CHECKOUT_URL = "https://mpago.la/1F4AEag";', s)
          imgs = ['images/ju-treino.jpg','images/ju-academia.jpg','images/ju-pilates.webp']
          counter = [0]
          def repl(m):
              before, src, after = m.group(1), m.group(2), m.group(3)
              if src.startswith('images/ju-'):
                  return m.group(0)
              out = imgs[counter[0] % len(imgs)]
              counter[0] += 1
              return before + out + after
          s = re.sub(r'(<img[^>]*?src=["\'])([^"\']+)(["\'])', repl, s)
          p.write_text(s, encoding='utf-8')
          print(f'Imagens atualizadas: {counter[0]}; checkout atualizado.')
          PY
      - name: Commit alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Atualizar fotos e link de pagamento"
          git push
